@switch (store()) {
  @case ('aldi') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#1c1c1a" />
      <path d="M7 25 16 6l9 19h-4.2L16 14.2 11.2 25Z" fill="#fff" />
    </svg>
  }
  @case ('tesco') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect
        x="1"
        y="1"
        width="30"
        height="30"
        rx="6"
        fill="none"
        stroke="#1c1c1a"
        stroke-width="2"
      />
      <text
        x="16"
        y="22"
        text-anchor="middle"
        font-size="16"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#1c1c1a"
      >
        T
      </text>
    </svg>
  }
  @case ('lidl') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="13" fill="none" stroke="#1c1c1a" stroke-width="2" />
      <circle cx="16" cy="16" r="8" fill="#1c1c1a" />
      <text
        x="16"
        y="20"
        text-anchor="middle"
        font-size="10"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#fff"
      >
        L
      </text>
    </svg>
  }
  @case ('dunnes') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="6" fill="#1c1c1a" />
      <text
        x="16"
        y="14"
        text-anchor="middle"
        font-size="5.5"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#fff"
      >
        DUNNES
      </text>
      <text
        x="16"
        y="22"
        text-anchor="middle"
        font-size="4.5"
        font-family="Inter, sans-serif"
        font-weight="600"
        fill="#fff"
      >
        STORES
      </text>
    </svg>
  }
  @case ('asda') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#1c1c1a" />
      <text
        x="16"
        y="20"
        text-anchor="middle"
        font-size="9"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#fff"
      >
        ASDA
      </text>
    </svg>
  }

  @case ('morrisons') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect
        x="1"
        y="1"
        width="30"
        height="30"
        rx="6"
        fill="none"
        stroke="#1c1c1a"
        stroke-width="2"
      />
      <text
        x="16"
        y="21"
        text-anchor="middle"
        font-size="15"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#1c1c1a"
      >
        M
      </text>
    </svg>
  }

  @case ('sainsburys') {
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="6" fill="#1c1c1a" />
      <text
        x="16"
        y="21"
        text-anchor="middle"
        font-size="15"
        font-family="Inter, sans-serif"
        font-weight="700"
        fill="#fff"
      >
        S
      </text>
    </svg>
  }
}
