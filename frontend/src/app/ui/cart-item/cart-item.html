<article class="card">
  <div class="thumb" aria-hidden="true">
    @switch (item().kind) {
      @case ('milk') {
        <svg class="art" viewBox="0 0 64 84">
          <path d="M16 22h32l6 8v46H10V30z" fill="#fff" stroke="#1c1c1a" stroke-width="2" />
          <path d="M16 22 22 12h20l6 10" fill="#f4f4f2" stroke="#1c1c1a" stroke-width="2" />
          <path d="M18 40h28v22H18z" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
          <text
            x="32"
            y="54"
            text-anchor="middle"
            font-size="8"
            font-family="Inter, sans-serif"
            fill="#1c1c1a"
          >
            MILK
          </text>
        </svg>
      }
      @case ('bread') {
        <svg class="art" viewBox="0 0 64 84">
          <path d="M18 30c0-10 28-10 28 0v36H18z" fill="#fff" stroke="#1c1c1a" stroke-width="2" />
          <path d="M18 30c0 6 28 6 28 0" fill="none" stroke="#1c1c1a" stroke-width="2" />
          <path d="M24 44h16M24 52h16M24 60h10" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
        </svg>
      }
      @case ('eggs') {
        <svg class="art" viewBox="0 0 64 84">
          <path
            d="M12 34h40v28a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z"
            fill="#fff"
            stroke="#1c1c1a"
            stroke-width="2"
          />
          <path d="M12 42h40" fill="none" stroke="#1c1c1a" stroke-width="2" />
          <circle cx="24" cy="54" r="5" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
          <circle cx="40" cy="54" r="5" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
        </svg>
      }
      @default {
        <svg class="art" viewBox="0 0 64 84">
          <rect
            x="12"
            y="18"
            width="40"
            height="52"
            rx="6"
            fill="#fff"
            stroke="#1c1c1a"
            stroke-width="2"
          />
          <path d="M20 34h24M20 44h24M20 54h16" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
        </svg>
      }
    }
  </div>

  <div class="info">
    <div class="name">{{ item().name }}</div>
    <div class="detail">{{ item().detail }}</div>
    <div class="best">
      <mat-icon aria-hidden="true">location_on</mat-icon>
      <span>Best price: {{ item().storeName }}</span>
    </div>
  </div>

  <div class="price">{{ linePrice() }}</div>

  <app-quantity-stepper
    class="stepper"
    [value]="item().quantity"
    (valueChange)="quantityChange.emit($event)"
  />

  <button
    type="button"
    class="remove"
    [attr.aria-label]="'Remove ' + item().name"
    (click)="removed.emit()"
  >
    <mat-icon aria-hidden="true">delete</mat-icon>
  </button>
</article>
