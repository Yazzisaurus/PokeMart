<app-auth-header title="Log in" />

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-text-field
    label="Email"
    type="email"
    autocomplete="email"
    [control]="form.controls.email"
    [error]="emailError()"
  />
  <app-text-field
    label="Password"
    type="password"
    autocomplete="current-password"
    [control]="form.controls.password"
    [error]="passwordError()"
  />
  <app-button type="submit">Log in</app-button>
  <app-button appearance="text" type="button">Forgot password?</app-button>
</form>
