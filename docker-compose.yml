services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: pokemart
      POSTGRES_PASSWORD: pokemart
      POSTGRES_DB: pokemart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: pgvector_init
        target: /docker-entrypoint-initdb.d/10-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemart -d pokemart"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.11
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:0.40.11
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama", "pull", "gemma3:1b"]
    restart: "no"

configs:
  pgvector_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

volumes:
  postgres_data:
  ollama_data:
