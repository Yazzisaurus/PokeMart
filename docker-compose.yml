services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: pokemart
      POSTGRES_PASSWORD: pokemart
      POSTGRES_DB: pokemart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: pgvector_init
        target: /docker-entrypoint-initdb.d/10-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemart -d pokemart"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

configs:
  pgvector_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;

volumes:
  postgres_data:
