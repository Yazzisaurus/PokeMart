name: CI/CD
on:   #Turns on checks and tells it when to check
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Allows read 0only access to the repository
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    frontend:
      name: Frontend
      runs-on: ubuntu-latest
      timeout-minutes: 10
      defaults:
        run:
          working-directory: frontend   # every "run:" below happens inside frontend/
      steps:
        - name: Get the code
          uses: actions/checkout@v5

        - name: Install Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - name: Install packages
          run: npm ci

        - name: Build
          run: npm run build

        - name: Unit tests
          run: npm test -- --watch=false

    python:
      name: Python (${{ matrix.project }}) - install and check
      runs-on: ubuntu-latest
      timeout-minutes: 15
      strategy:
        fail-fast: false           # if one folder fails, still finish the other
        matrix:
          project: [fastapi]
      defaults:
        run:
          working-directory: ${{ matrix.project }}
      steps:
        - name: Get the code
          uses: actions/checkout@v5


        - name: Work out how this folder installs packages
          id: detect
          run: |
            if [ -f uv.lock ]; then
              echo "tool=uv" >> "$GITHUB_OUTPUT"
            elif [ -f requirements.txt ]; then
              echo "tool=pip" >> "$GITHUB_OUTPUT"
            else
              echo "::error::No uv.lock or requirements.txt in ${{ matrix.project }}/ - is the folder name right?"
              exit 1
            fi

        - name: Install Python
          uses: actions/setup-python@v6
          with:
            python-version: "3.12"

        # uv folders
        - name: Install uv
          if: steps.detect.outputs.tool == 'uv'
          uses: astral-sh/setup-uv@v6
          with:
            enable-cache: true
            cache-dependency-glob: ${{ matrix.project }}/uv.lock

        - name: Install packages (uv)
          if: steps.detect.outputs.tool == 'uv'
          run: uv sync --locked

        # pip folders
        - name: Install packages (pip)
          if: steps.detect.outputs.tool == 'pip'
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

        - name: Check every Python file is valid
          run: python -m compileall -q .

        - name: Run tests (if any exist)
          run: |
            if [ -n "$(find . -path ./.venv -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)" ]; then
              if [ "${{ steps.detect.outputs.tool }}" = "uv" ]; then
                uv run --with pytest pytest
              else
                python -m pip install pytest
                python -m pytest
              fi
            else
              echo "No test files found - skipping."
            fi
    
    backend:
      name: Backend (NestJS) - build and test
      runs-on: ubuntu-latest
      timeout-minutes: 15
      defaults:
        run:
          working-directory: backend
      env:
        # Prisma needs address to generate client, but we don't actually connect to it in this job.
        DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      steps:
        - name: Get the code
          uses: actions/checkout@v5

        - name: Install Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 24
            cache: npm
            cache-dependency-path: backend/package-lock.json

        - name: Install packages
          run: npm ci

        - name: Build
          run: npm run build

        - name: Unit tests
          run: npm test

        - name: Lint
          if: ${{ !cancelled() }}
          continue-on-error: true
          run: npm run lint

    database:
      name: Database (Postgres + pgvector) - starts and is healthy
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - name: Get the code
          uses: actions/checkout@v5

        #checking if compose file is valid,  "-q" = say nothing unless broken.
        - name: Validate docker-compose.yml
          run: docker compose -f docker-compose.yml config -q

        - name: Start Postgres
          run: docker compose -f docker-compose.yml up -d --wait postgres

        - name: Check pgvector extension exists
          run: |
            docker compose -f docker-compose.yml exec -T postgres \
              psql -U pokemart -d pokemart -tAc "SELECT extname FROM pg_extension WHERE extname = 'vector';" \
              | grep -qx vector

        - name: Show logs if something went wrong
          if: failure()
          run: docker compose -f docker-compose.yml logs postgres

        - name: Clean up
          if: always()
          run: docker compose -f docker-compose.yml down -v

    images:
      name: Docker image (${{ matrix.image }})
      needs: [frontend, python, database]
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
        contents: read
        packages: write            # allowed to upload to this repo's registry
      strategy:
        fail-fast: false
        matrix:
          image: [frontend, fastapi]
      steps:
        - name: Get the code
          uses: actions/checkout@v5

        # Buildx = Docker's modern builder
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # Log in to ghcr.io using GITHUB_TOKEN.
        # Only done on main.
        - name: Log in to GitHub Container Registry
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Work out image name and tags
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha

        - name: Build (and push on main)
          uses: docker/build-push-action@v6
          with:
            context: .
            file: .github/docker/${{ matrix.image }}.Dockerfile
            push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha,scope=${{ matrix.image }}
            cache-to: type=gha,mode=max,scope=${{ matrix.image }}