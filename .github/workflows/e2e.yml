name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Browser tests (sign in, pages, cart)
    # Secrets are not handed to pull requests from forks (a safety rule), so
    # the shopper's password would be empty there. Skip those runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The test shopper. Create these in: repo Settings > Secrets and variables > Actions.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Where the app will be running on this rented computer.
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8000
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      # Fail early with a clear sentence instead of a confusing login error.
      - name: Check the test shopper's login exists
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::Add repo secrets E2E_EMAIL and E2E_PASSWORD (a real test account in the app)."
            exit 1
          fi

      # ---- Start the whole app -------------------------------------------
      # Database + API + website, from the two compose files. "--build" makes
      # the images fresh from this commit's code.
      - name: Start database, API and website
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build --wait

      # Compose says "started", not "ready to answer". Knock on each door
      # (max 2 minutes) until it answers. "-f" = treat error pages as failure.
      - name: Wait until the website and API answer
        run: |
          for url in "$BASE_URL" "$API_URL/docs"; do
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then echo "  up"; break; fi
              if [ "$i" = "60" ]; then echo "::error::$url never answered"; exit 1; fi
              sleep 2
            done
          done

      # ---- Get the test robot ready --------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Use the lock file if the team has committed one (exact, repeatable
      # installs); otherwise fall back to a normal install.
      - name: Install test packages
        working-directory: .github/e2e
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Downloads Chromium plus the Linux libraries it needs.
      - name: Install the browser
        working-directory: .github/e2e
        run: npx playwright install --with-deps chromium

      # ---- The three checks, each its own line in the GitHub UI -----------
      # "!cancelled()" = run this step even if the one before failed, so one
      # failure does not hide the results of the others.
      - name: Sign-in tests
        working-directory: .github/e2e
        run: npx playwright test signin

      - name: Page navigation tests
        if: ${{ !cancelled() }}
        working-directory: .github/e2e
        run: npx playwright test navigation

      - name: Shopping cart tests
        if: ${{ !cancelled() }}
        working-directory: .github/e2e
        run: npx playwright test cart

      # ---- Evidence and tidy-up -------------------------------------------
      # The report holds screenshots and traces of failed tests. Download it
      # from the bottom of the run's page ("Artifacts").
      - name: Save the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .github/e2e/playwright-report/
            .github/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show app logs if something went wrong
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color

      - name: Stop the app
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v
