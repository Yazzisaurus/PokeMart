# Settings for nginx, the web server that hands out the Angular site.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Try the exact file; else try it as a folder; else give index.html and let
  # Angular decide what to show. Without this, refreshing the browser on a
  # page like /prices would give a "404 Not Found".
  location / {
    try_files $uri $uri/ /index.html;
  }
}
